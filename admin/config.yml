# Decap CMS editor for the portfolio. Login is handled by DecapBridge (email + password).
backend:
  name: git-gateway
  repo: AshCUB/Teegan-Portfolio
  branch: main
  # Replace with the identity URL from your DecapBridge site dashboard.
  identity_url: https://auth.decapbridge.com/sites/REPLACE_WITH_DECAPBRIDGE_SITE_ID
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: "Create {{collection}} “{{slug}}” via editor ({{author-name}})"
    update: "Update {{collection}} “{{slug}}” via editor ({{author-name}})"
    delete: "Delete {{collection}} “{{slug}}” via editor ({{author-name}})"
    uploadMedia: "Upload “{{path}}” via editor ({{author-name}})"
    deleteMedia: "Delete “{{path}}” via editor ({{author-name}})"

# Lets you test the editor on localhost with `npx decap-server`; ignored on the live site.
local_backend: true

site_url: https://ashcub.github.io/Teegan-Portfolio/
display_url: https://ashcub.github.io/Teegan-Portfolio/

media_folder: assets/images
# Stored as "/assets/images/..."; the site strips the leading slash so it works under the GitHub Pages subpath.
public_folder: /assets/images

collections:
  - name: portfolio
    label: Portfolio
    editor:
      preview: false
    files:
      - name: portfolio
        label: Portfolio pieces
        file: content/portfolio.json
        format: json
        fields:
          - label: Sections
            name: sections
            widget: list
            collapsed: true
            summary: "{{fields.title}}"
            hint: Drag sections to reorder them. Each section gets its own collage page in the PDF.
            fields:
              - { label: Section name, name: title, widget: string }
              - { label: Section intro, name: intro, widget: text }
              - label: Show these pieces in the homepage slideshow
                name: slideshow
                widget: boolean
                default: false
                required: false
              - label: Pieces
                name: pieces
                widget: list
                collapsed: true
                summary: "{{fields.title}}"
                hint: Drag pieces to reorder them. Use "Add piece" to add a new one.
                label_singular: piece
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Subtitle, name: subtitle, widget: string, required: false, hint: "Optional, e.g. the character or theme." }
                  - { label: Image, name: image, widget: image, choose_url: false, hint: "JPG or PNG. Large photos are fine." }
                  - { label: Description, name: blurb, widget: text }
                  - { label: Medium, name: medium, widget: string, hint: 'e.g. "Digital illustration" or "Ceramic & glaze".' }
                  - label: Collage crop (optional)
                    name: focus
                    widget: string
                    required: false
                    hint: 'Where to crop this image on the section collage page, as "left% top%", e.g. "50% 70%". Leave blank to center.'
                  - label: Slideshow crop (optional)
                    name: heroFocus
                    widget: string
                    required: false
                    hint: 'Where to aim the homepage slideshow, usually at a face, as "left% top%", e.g. "50% 25%".'

          - { label: Name, name: artist, widget: string }
          - { label: PDF cover title, name: title, widget: string }
          - { label: PDF cover subtitle, name: subtitle, widget: string }
          - { label: PDF cover image, name: coverImage, widget: image, choose_url: false }
          - label: About text (not currently shown on the site)
            name: about
            widget: list
            required: false
            field: { label: Paragraph, name: paragraph, widget: text }

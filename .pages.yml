# Pages CMS editor (https://app.pagescms.org). Saving commits to this repo, which rebuilds the site and PDF.
media:
  input: assets/images
  output: /assets/images
  categories: [image]
  rename: safe

settings:
  commit:
    identity: user

content:
  - name: portfolio
    label: Portfolio
    type: file
    path: content/portfolio.json
    format: json
    fields:
      - name: sections
        label: Sections
        type: object
        description: Drag to reorder. Each section gets its own collage page in the PDF.
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Section name
            type: string
            required: true
          - name: intro
            label: Section intro
            type: text
          - name: pieces
            label: Pieces
            type: object
            description: Drag to reorder. Use "Add an entry" to add a new piece.
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Title
                type: string
                required: true
              - name: subtitle
                label: Subtitle
                type: string
                description: Optional, e.g. the character or theme.
              - name: image
                label: Image
                type: image
                required: true
                description: JPG or PNG. Large photos are fine.
              - name: blurb
                label: Description
                type: text
                required: true
              - name: medium
                label: Medium
                type: string
                description: e.g. "Digital illustration" or "Ceramic & glaze".
              # Crop position ("left% top%") on the section collage page; hidden from the editor.
              - name: focus
                type: string
                hidden: true

      - name: artist
        label: Name
        type: string
      - name: title
        label: PDF cover title
        type: string
      - name: subtitle
        label: PDF cover subtitle
        type: string
      - name: coverImage
        label: PDF cover image
        type: image
      - name: showClosing
        label: Include the "Thank you for viewing" page at the end of the PDF
        type: boolean
        default: true

  - name: slideshow
    label: Homepage slideshow
    type: file
    path: content/slideshow.json
    format: json
    fields:
      - name: slides
        label: Slides
        type: object
        description: The pictures behind the homepage intro, in order (drag to reorder). Add just one for a single still backdrop.
        list:
          min: 1
          collapsible:
            collapsed: false
            summary: "Slide {index}"
        fields:
          - name: image
            label: Picture
            type: image
            required: true
          - name: horizontal
            label: Focus left / right
            type: select
            description: Which part of the picture stays in view on wide screens.
            options:
              values:
                - { name: "20%", label: Far left }
                - { name: "35%", label: Left }
                - { name: "50%", label: Center }
                - { name: "65%", label: Right }
                - { name: "80%", label: Far right }
          - name: vertical
            label: Focus up / down
            type: select
            description: Usually aim this at a face.
            options:
              values:
                - { name: "10%", label: Very top }
                - { name: "20%", label: Top }
                - { name: "30%", label: Upper middle }
                - { name: "40%", label: Middle }
                - { name: "60%", label: Lower middle }
                - { name: "80%", label: Bottom }
